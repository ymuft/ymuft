<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Gabriel Poças profile terminal">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #7d8590; }
    .accent { fill: #2f81f7; }
    .text { fill: #8c959f; }
