  <rect x="1" y="1" width="878" height="148" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="23" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="23" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="23" r="5" fill="#27c93f"/>
  <text x="24" y="66" class="mono muted" font-size="15">gabriel@ymuft:~$</text>
  <text x="168" y="66" class="mono text" font-size="15">build --from industrial-data --to usable-software</text>
  <text x="24" y="100" class="mono accent" font-size="18">PHP · SQL · Linux · automation</text>
  <text x="24" y="128" class="mono muted" font-size="14">small tools, real workflows, less manual work</text>
  <rect x="421" y="114" width="8" height="17" rx="1" class="cursor"/>
